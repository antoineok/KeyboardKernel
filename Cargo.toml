[package]
name = "keywork"
version = "0.1.0"
edition = "2021"

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
lto = false

[profile.release]
panic = "abort"

lto = true

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
aarch64-cpu = "11.1.0"
fdt = "0.1.5"
linked_list_allocator = "0.10.5"
tock-registers = "0.10.0"

[features]
jtag = []
