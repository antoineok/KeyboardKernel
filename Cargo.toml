[package]
name = "keywork"
version = "0.1.0"
edition = "2021"

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
lto = false

# Final production/performance measurements
[profile.release]
panic = "abort"
opt-level = 3
debug = 0
strip = "none"
lto = "fat"
codegen-units = 1
incremental = false
debug-assertions = false
overflow-checks = false

# Optimized build intended for GDB
[profile.gdb_release]
inherits = "release"

# Still optimized, but less destructive to source-level debugging.
opt-level = 2
debug = 2
strip = "none"
lto = false
codegen-units = 16
incremental = false

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
aarch64-cpu = "11.2.0"
fdt = "0.1.5"
linked_list_allocator = "0.10.5"
tock-registers = { version = "0.10.0", default-features = false }

[features]
jtag = []
