[tasks.build-img]
dependencies = ["clear"]
script = [
    "cargo build",
    "aarch64-none-elf-objcopy -O binary target/aarch64-unknown-none/debug/kernel kernel8.img",
]

[tasks.build-img-jtag]
dependencies = ["clear"]
script = [
    "cargo build --features jtag",
    "aarch64-none-elf-objcopy -O binary target/aarch64-unknown-none/debug/kernel kernel8.img",
]

[tasks.clear]
script = ["cargo clean", "rm -f kernel8.img"]

[tasks.openocd]
script = ["openocd"]

[tasks.gdb]
script = "RUST_GDB=aarch64-none-elf-gdb rust-gdb"

[tasks.gdbgui]
script = "RUST_GDB=aarch64-none-elf-gdb rust-gdbgui target/aarch64-unknown-none/debug/kernel"