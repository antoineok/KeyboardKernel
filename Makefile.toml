[tasks.build-img]
dependencies = ["clear"]
script = [
    "cargo build",
    "aarch64-none-elf-objcopy -O binary target/aarch64-unknown-none/debug/kernel kernel8.img",
]

[tasks.build-img-jtag]
dependencies = ["clear"]
script = [
    "cargo build --features jtag",
    "aarch64-none-elf-objcopy -O binary target/aarch64-unknown-none/debug/kernel kernel8.img",
]

[tasks.clear]
script = ["cargo clean", "rm -f kernel8.img"]

[tasks.openocd]
script = ["openocd"]

[tasks.gdb]
script = "RUST_GDB=aarch64-none-elf-gdb rust-gdb"

[tasks.gdbgui]
script = '''
    #!/bin/sh
    # Exit if anything fails
    set -e

    # Prefer rustc in the same directory as this script
    DIR="$(dirname "$0")"
    if [ -x "$DIR/rustc" ]; then
    RUSTC="$DIR/rustc"
    else
    RUSTC="rustc"
    fi

    RUSTC_SYSROOT="$("$RUSTC" --print=sysroot)"
    GDB_PYTHON_MODULE_DIRECTORY="$RUSTC_SYSROOT/lib/rustlib/etc"
    # Get the commit hash for path remapping
    RUSTC_COMMIT_HASH="$("$RUSTC" -vV | sed -n 's/commit-hash: \([a-zA-Z0-9_]*\)/\1/p')"

    # Run GDB with the additional arguments that load the pretty printers
    # Set the environment variable `RUST_GDB` to overwrite the call to a
    # different/specific command (defaults to `gdb`).
    RUST_GDB="${RUST_GDB:-gdb}"
    PORT="${GDBGUI_PORT:-5000}"
    HOST="${GDBGUI_HOST:-127.0.0.1}"
    PYTHONPATH="$PYTHONPATH:$GDB_PYTHON_MODULE_DIRECTORY" exec /home/antoineok/gdb-frontend/gdbfrontend \
        -H ${HOST} -p "${PORT}" \
        -g "${RUST_GDB}" \
        -G  "--directory=\"$GDB_PYTHON_MODULE_DIRECTORY\" \
            -iex \"add-auto-load-safe-path $GDB_PYTHON_MODULE_DIRECTORY\" \
            -iex \"add-auto-load-safe-path /run/media/antoineok/DATA2/Keyboard/kernel/.gdbinit\" \
            -iex \"set substitute-path /rustc/$RUSTC_COMMIT_HASH $RUSTC_SYSROOT/lib/rustlib/src/rust\""
'''