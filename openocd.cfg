# === openocd.cfg ===
# Interface configuration for CH347 JTAG adapter
adapter driver ch347
ch347 vid_pid 0x1a86 0x55DD

# Slower speed if you ever get scan errors (you can raise it later)
adapter speed 10000

# Use JTAG (not SWD)
transport select jtag

# Raspberry Pi 4 / Compute Module 4 target
source [find target/bcm2711.cfg]

# Optional: Reset configuration
# The CH347 has TRST but no nSRST connection on your unit
reset_config trst_only

# GDB servers (you can comment these to only use one)
# cpu0:3333  cpu1:3334  cpu2:3335  cpu3:3336
