[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
runner = "qemu-system-aarch64 -M raspi4b -chardev file,id=pl011,path=pl011_uart.log -serial chardev:pl011 -serial stdio -kernel" # Optional: for QEMU emulation/testing
rustflags = ["-C", "link-arg=-Tkernel.ld"]

[unstable]
build-std = ["core"]
